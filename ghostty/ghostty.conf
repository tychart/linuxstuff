keybind = performable:ctrl+c=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard

# Compatibility for Gnome Clipboard Indicator Extension
keybind = ctrl+shift+insert=paste_from_clipboard

# This command (not config, just copy it and execute it) fixes wierd bugs when trying to use ghostty to ssh
# to older remote machines that don't have Ghostty's 
# terminal info `terminfo` already installed
# This will fix the `clear` command outputting: "'xterm-ghostty': unknown terminal type." 

# Run from local machine with ghostty installed
infocmp -x xterm-ghostty | ssh YOUR-SERVER -- tic -x -
